[pytest]
testpaths = tests
addopts = --strict-markers -ra

# TODO 1 (Task 2): register the four markers below, one per line, each with a short
# description, e.g.   smoke: fast sanity checks
# Markers to register: smoke, regression, boundary, slow
# Until you do, any test using @pytest.mark.smoke will ERROR because of --strict-markers.
markers =
    smoke: quick checks of the main functionality
    regression: checks that existing functionality still works
    boundary: checks values at or near the limits
    slow: tests that may take longer to run